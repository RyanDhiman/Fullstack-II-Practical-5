# MongoDB connection
# Local MongoDB:
spring.data.mongodb.uri=mongodb://localhost:27017/postsdb
# If using MongoDB Atlas instead, replace the line above with your Atlas URI, e.g.:
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster-url>/postsdb?retryWrites=true&w=majority

server.port=8080

# Include the correlation ID (set by CorrelationInterceptor via MDC) in every log line
logging.pattern.console=%d{HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
